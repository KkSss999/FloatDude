name: macOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 toolchain
        run: >-
          xcode_path=$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort -V | tail -n 1);
          test -n "$xcode_path";
          sudo xcode-select -s "$xcode_path/Contents/Developer"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Scan tracked content for credential patterns
        run: bash Scripts/secret-scan.sh

      - name: Build with SwiftPM
        run: swift build

      - name: Test with SwiftPM
        run: swift test

      - name: Build the macOS app target
        run: >-
          xcodebuild
          -project FloatDude.xcodeproj
          -scheme FloatDude
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Test the macOS app target
        run: >-
          xcodebuild
          -project FloatDude.xcodeproj
          -scheme FloatDude
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          test
